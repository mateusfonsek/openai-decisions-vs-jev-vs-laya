[project]
name = "openai-decisions-vs-jev-vs-laya"
version = "0.1.0"
description = "Benchmark de decision models (OpenAI Decisions API, Jev, Laya) em PT-BR"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "python-dotenv>=1",
  "matplotlib>=3.8",
  "rich>=15.0.0",
]

[project.optional-dependencies]
laya = ["laya>=0.3.28"]

[project.scripts]
bench = "bench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
